services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # cria as tabelas na primeira subida
      - dados:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 (TCP) de propósito: na primeira subida o Postgres roda um servidor
      # temporário só no socket local enquanto cria as tabelas. Sem o -h, o healthcheck
      # diria "pronto" nessa janela e o backend tentaria conectar antes da hora.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  mcp-server:
    build: ./mcp-server
    environment:
      DUMMYJSON_URL: ${DUMMYJSON_URL:-https://dummyjson.com}   # troque p/ simular falha
      DUMMYJSON_TIMEOUT_S: "5"
    # Sem porta publicada: só o backend fala com ele, pela rede interna do Compose.

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MCP_URL: http://mcp-server:8001/mcp
    depends_on:
      db: { condition: service_healthy }
      mcp-server: { condition: service_started }
    ports: ["${API_PORT:-8000}:8000"]   # API; troque no .env se a porta estiver em uso

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["${CHAT_PORT:-3000}:80"]    # chat; troque no .env se a porta estiver em uso

volumes:
  dados:
