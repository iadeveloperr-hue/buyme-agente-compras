server {
    listen 80;
    root /usr/share/nginx/html;

    # O navegador só fala com este servidor; /api é repassado ao backend (sem CORS).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
