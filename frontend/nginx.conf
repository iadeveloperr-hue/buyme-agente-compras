server {
    listen 80;
    root /usr/share/nginx/html;

    # O navegador só fala com este servidor; /api é repassado ao backend (sem CORS).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_connect_timeout 5s;   # backend caído: falha rápido, o chat mostra o aviso
        proxy_read_timeout 120s;    # acima do prazo do agente (100 s), que responde antes
    }

    location / {
        try_files $uri /index.html;
    }
}
