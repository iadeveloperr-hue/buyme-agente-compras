server {
    listen 80;
    root /usr/share/nginx/html;

    # DNS interno do Docker, consultado de novo a cada 10 s. Sem isso, o nginx guarda o IP que
    # o backend tinha quando o chat subiu: se o backend reinicia e ganha outro IP, o chat diz
    # "backend fora do ar" com o backend funcionando.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # O navegador só fala com este servidor; /api é repassado ao backend (sem CORS).
    location /api/ {
        set $backend http://backend:8000;   # a variável é o que faz o nginx usar o resolver
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_connect_timeout 5s;   # backend caído: falha rápido, o chat mostra o aviso
        proxy_read_timeout 120s;    # acima do prazo do agente (100 s), que responde antes
    }

    location / {
        try_files $uri /index.html;
    }
}
